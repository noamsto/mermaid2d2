version: 2
builds:
  - id: m2d2
    main: ./cmd/m2d2
    binary: m2d2
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w
      - -X main.version={{ .Version }}
archives:
  - # prebuilt binaries for `go install`-free users
    name_template: "m2d2_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
checksum:
  name_template: checksums.txt
changelog:
  # release-please owns the release notes; don't compute one we'd discard.
  disable: true
release:
  # release-please creates the tag and GitHub release (with the changelog)
  # before this runs; keep its notes and just attach the built archives.
  mode: keep-existing
