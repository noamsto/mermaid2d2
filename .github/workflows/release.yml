name: release

on:
  push:
    branches: [main]
  # release-automerge.yml merges the release PR with the App token, whose push
  # triggers this workflow natively. It dispatches this only as a backstop when
  # no release PR is pending, to recover a missed push run (release-please is
  # idempotent).
  workflow_dispatch:

permissions:
  contents: write

# A push run and the cron's backstop dispatch can overlap; both would try to
# cut the same release.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
    steps:
      # Release-PR pushes made with GITHUB_TOKEN trigger no CI, so the required
      # checks never report and the PR can't merge.
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          client-id: ${{ vars.VENDOR_HASH_APP_CLIENT_ID }}
          private-key: ${{ secrets.VENDOR_HASH_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          # Tag/ref updates need workflows once the tagged tree's workflow
          # files differ from the default branch.
          permission-workflows: write

      - uses: googleapis/release-please-action@v5
        id: rp
        with:
          token: ${{ steps.app-token.outputs.token }}

  # Chained on this run's outputs rather than a tag trigger, so the archives
  # build as soon as release-please cuts the release.
  goreleaser:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ needs.release-please.outputs.tag_name }}
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
