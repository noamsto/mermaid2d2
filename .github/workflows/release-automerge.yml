name: release-automerge

# Bounds how long a release-please PR can sit unmerged. The merge uses the App
# token so its push triggers release.yml; a GITHUB_TOKEN merge would not. With no
# pending PR, release.yml is dispatched instead to recover a missed push run
# (release-please is idempotent).
on:
  schedule:
    - cron: "0 9 * * 1,4" # Mon & Thu, 09:00 UTC
  workflow_dispatch:

permissions:
  pull-requests: read
  actions: write

jobs:
  automerge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          client-id: ${{ vars.VENDOR_HASH_APP_CLIENT_ID }}
          private-key: ${{ secrets.VENDOR_HASH_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Merge pending release PR or re-run release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          pr=$(gh pr list --repo "$GITHUB_REPOSITORY" \
            --label "autorelease: pending" --state open \
            --json number --jq '.[0].number')
          if [ -z "$pr" ]; then
            echo "No pending release PR — dispatching release.yml."
            gh workflow run release.yml --repo "$GITHUB_REPOSITORY"
            exit 0
          fi
          echo "Merging release PR #$pr"
          GH_TOKEN="$APP_TOKEN" gh pr merge "$pr" --repo "$GITHUB_REPOSITORY" --squash
