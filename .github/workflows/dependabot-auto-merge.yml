name: Dependabot auto-merge

# A dependency bump with green CI has nothing left for a human to decide.
# Auto-merge queues the PR and GitHub merges it the moment the required checks
# pass, so a red build simply leaves it sitting instead of needing a sweep.
#
# pull_request_target is what lets this read the App secrets: Dependabot-
# triggered pull_request runs cannot. It is safe because nothing from the PR is
# checked out or run.
on:
  pull_request_target:
    types: [opened, synchronize, reopened]

# GITHUB_TOKEN only reads metadata. The merge is made with the App token so its
# push triggers release.yml and CI, which a GITHUB_TOKEN merge would not.
permissions:
  contents: read
  pull-requests: read

jobs:
  auto-merge:
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: dependabot/fetch-metadata@v3
        id: metadata
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/create-github-app-token@v3
        id: app-token
        if: steps.metadata.outputs.package-ecosystem == 'nix' || steps.metadata.outputs.update-type != 'version-update:semver-major'
        with:
          client-id: ${{ vars.VENDOR_HASH_APP_CLIENT_ID }}
          private-key: ${{ secrets.VENDOR_HASH_APP_PRIVATE_KEY }}

      - name: Enable auto-merge
        # Nix flake-input "versions" are commit pins, yet fetch-metadata still
        # reports them as semver-major, so the nix ecosystem is always eligible;
        # majors stay held for Go modules and Actions.
        if: steps.metadata.outputs.package-ecosystem == 'nix' || steps.metadata.outputs.update-type != 'version-update:semver-major'
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
